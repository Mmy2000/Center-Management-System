{% extends "console/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <div class="console-card mt-5">
      <h1 class="h5 mb-1">Platform console</h1>
      <p class="text-muted small mb-4">Operators only. Center staff sign in on their own subdomain.</p>
      {% if error %}<div class="alert alert-danger py-2 small">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small" for="id_username">Username</label>
          <input class="form-control" id="id_username" name="username" autocomplete="username" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label small" for="id_password">Password</label>
          <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-dark w-100" type="submit">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
