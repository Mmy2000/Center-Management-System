{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "طالب جديد" %}{% endblock %}

{% block content %}
<nav class="small mb-2"><a href="{% url 'students:list' %}">{% translate "الطلاب" %}</a> / {% translate "جديد" %}</nav>
<h1 class="h4 mb-3">{% translate "تسجيل طالب جديد" %}</h1>

<div class="card">
  <div class="card-body">
    <form id="student-form" class="row g-3" novalidate>
      <div class="col-md-6">
        <label class="form-label">{% translate "الاسم الكامل" %} *</label>
        <input class="form-control" name="full_name" required>
        <div class="text-danger small" data-error-for="full_name"></div>
      </div>
      <div class="col-md-3">
        <label class="form-label">{% translate "الصف" %} *</label>
        <select class="form-select" name="grade">
          {% for grade in grades %}<option value="{{ grade.id }}">{{ grade.stage }} — {{ grade }}</option>{% endfor %}
        </select>
        <div class="text-danger small" data-error-for="grade"></div>
      </div>
      <div class="col-md-3">
        <label class="form-label">{% translate "النوع" %}</label>
        <select class="form-select" name="gender">
          <option value="">—</option>
          <option value="MALE">{% translate "ذكر" %}</option>
          <option value="FEMALE">{% translate "أنثى" %}</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">{% translate "هاتف الطالب" %}</label>
        <input class="form-control" name="phone" inputmode="numeric" placeholder="01012345678">
        <div class="text-danger small" data-error-for="phone"></div>
      </div>
      <div class="col-md-3">
        <label class="form-label">{% translate "ولي الأمر" %}</label>
        <input class="form-control" name="guardian_name">
      </div>
      <div class="col-md-3">
        <label class="form-label">{% translate "هاتف ولي الأمر" %} *</label>
        <input class="form-control" name="guardian_phone" inputmode="numeric" placeholder="01012345678">
        <div class="text-danger small" data-error-for="guardian_phone"></div>
      </div>
      <div class="col-md-3">
        <label class="form-label">{% translate "صلة القرابة" %}</label>
        <select class="form-select" name="guardian_relation">
          <option value="">—</option>
          <option value="FATHER">{% translate "الأب" %}</option>
          <option value="MOTHER">{% translate "الأم" %}</option>
          <option value="OTHER">{% translate "آخر" %}</option>
        </select>
      </div>

      <div class="col-md-3">
        <label class="form-label">{% translate "تاريخ الميلاد" %}</label>
        <input class="form-control" type="date" name="date_of_birth">
      </div>
      <div class="col-md-3">
        <label class="form-label">{% translate "المدرسة" %}</label>
        <input class="form-control" name="school">
      </div>
      <div class="col-md-6">
        <label class="form-label">{% translate "العنوان" %}</label>
        <input class="form-control" name="address">
      </div>

      <div class="col-12">
        <label class="form-label">{% translate "ملاحظات" %}</label>
        <textarea class="form-control" name="notes" rows="2"></textarea>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">{% translate "حفظ ومتابعة" %}</button>
        <a class="btn btn-outline-secondary" href="{% url 'students:list' %}">{% translate "إلغاء" %}</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById("student-form").addEventListener("submit", async function (event) {
  event.preventDefault();
  document.querySelectorAll("[data-error-for]").forEach((n) => (n.textContent = ""));

  const payload = {};
  new FormData(event.target).forEach(function (value, key) {
    if (value !== "") { payload[key] = value; }
  });

  try {
    const result = await http.post("{% url 'students_api:students' %}", payload);
    app.toast((gettext("تم تسجيل الطالب") + " ") + result.data.student.student_code, "success");
    window.location = "/students/" + result.data.student.id + "/";
  } catch (error) {
    if (error.field_errors) {
      Object.entries(error.field_errors).forEach(function ([field, messages]) {
        const node = document.querySelector('[data-error-for="' + field + '"]');
        if (node) { node.textContent = messages.join(" "); }
        else { app.toast(messages.join(" "), "danger"); }
      });
    } else {
      app.handleError(error);
    }
  }
});
</script>
{% endblock %}
